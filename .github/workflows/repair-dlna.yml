name: repair-dlna
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DLNA metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/srv/dlna.go')
          s = p.read_text()
          s = s.replace('ID, Parent, Title string\n\tSize              int64\n\tContainer         bool', 'ID, Parent, Title string\n\tSize              int64\n\tModTime           time.Time\n\tContainer         bool')
          s = s.replace('entries = append(entries, didlObject{ID: url.PathEscape(filepath.ToSlash(rel)), Parent: objectID, Title: e.Name(), Size: fileSize(full)})', 'modTime := time.Now()\n\t\tif info, statErr := e.Info(); statErr == nil && !info.ModTime().IsZero() {\n\t\t\tmodTime = info.ModTime()\n\t\t}\n\t\tentries = append(entries, didlObject{ID: url.PathEscape(filepath.ToSlash(rel)), Parent: objectID, Title: e.Name(), Size: fileSize(full), ModTime: modTime})')
          old = 'return fmt.Sprintf(`<item id="%s" parentID="%s" restricted="1"><dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">%s</dc:title><upnp:class xmlns:upnp="urn:schemas-upnp-org:metadata-1-0/upnp/">object.item.videoItem</upnp:class><res protocolInfo="http-get:*:%s:*" size="%d">%s/media/%s</res></item>`, html.EscapeString(x.ID), html.EscapeString(x.Parent), html.EscapeString(x.Title), mimeType(x.Title), x.Size, strings.TrimRight(base, "/"), x.ID)'
          new = 'return fmt.Sprintf(`<item id="%s" parentID="%s" restricted="1"><dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">%s</dc:title><dc:date xmlns:dc="http://purl.org/dc/elements/1.1/">%s</dc:date><upnp:class xmlns:upnp="urn:schemas-upnp-org:metadata-1-0/upnp/">object.item.videoItem</upnp:class><res protocolInfo="http-get:*:%s:DLNA.ORG_OP=01;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000" size="%d" duration="00:00:00.000">%s/media/%s</res></item>`, html.EscapeString(x.ID), html.EscapeString(x.Parent), html.EscapeString(x.Title), x.ModTime.UTC().Format(time.RFC3339), mimeType(x.Title), x.Size, strings.TrimRight(base, "/"), x.ID)'
          if old not in s:
              raise SystemExit('expected DIDL item template not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          gofmt -w internal/srv/dlna.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/srv/dlna.go
          git commit -m 'fix: improve DLNA TV metadata compatibility'
          git push
