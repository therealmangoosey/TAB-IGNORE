name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Generate dependency checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add go.mod go.sum
            git commit -m 'chore: update Go module checksums'
            git push
          fi
      - run: go mod download
      - run: gofmt -w .
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o hmt ./cmd/hmt
