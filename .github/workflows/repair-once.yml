name: Repair once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Repair compiler and DB issues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/provider/archiveorg.go')
          s=p.read_text(); s=s.replace('\t\t\t_ = f.Size.Int64()\n',''); p.write_text(s)
          p=Path('internal/provider/debrid.go')
          s=p.read_text(); s=s.replace('"context"\n', '"context"\n\t"fmt"\n', 1); p.write_text(s)
          p=Path('internal/srv/dlna.go')
          s=p.read_text(); s=s.replace('type soapEnvelope struct{Body struct{Action xml.RawMessage `xml:",any"`} `xml:"Body"`}', 'type soapEnvelope struct{Body struct{Action []byte `xml:",innerxml"`} `xml:"Body"`}'); s=s.replace('func actionName(header string,raw xml.RawMessage)', 'func actionName(header string,raw []byte)'); p.write_text(s)
          p=Path('internal/db/store.go')
          s=p.read_text()
          s=s.replace('var src string\n\terr := d.conn.QueryRowContext(ctx,', 'var src string\n\tvar createdAt, startedAt, finishedAt, nextRetryAt string\n\terr := d.conn.QueryRowContext(ctx,', 1)
          s=s.replace('&j.ErrKind, &j.SHA256, &j.TargetPath, &j.TmpPath, &j.CreatedAt, &j.StartedAt, &j.FinishedAt, &j.NextRetryAt)', '&j.ErrKind, &j.SHA256, &j.TargetPath, &j.TmpPath, &createdAt, &startedAt, &finishedAt, &nextRetryAt)', 1)
          s=s.replace('\tif err != nil {\n\t\treturn j, err\n\t}\n\tif err := json.Unmarshal([]byte(src), &j.Source);', '\tif err != nil {\n\t\treturn j, err\n\t}\n\tj.CreatedAt = parseTime(createdAt)\n\tj.StartedAt = parseTime(startedAt)\n\tj.FinishedAt = parseTime(finishedAt)\n\tj.NextRetryAt = parseTime(nextRetryAt)\n\tif err := json.Unmarshal([]byte(src), &j.Source);', 1)
          needle='\t\tvar j hermit.Job\n\t\tvar src string\n\t\tif err := rows.Scan'
          repl='\t\tvar j hermit.Job\n\t\tvar src string\n\t\tvar createdAt, startedAt, finishedAt, nextRetryAt string\n\t\tif err := rows.Scan'
          s=s.replace(needle,repl,1)
          s=s.replace('&j.ErrKind, &j.SHA256, &j.TargetPath, &j.TmpPath, &j.CreatedAt, &j.StartedAt, &j.FinishedAt,\n\t\t\t&j.NextRetryAt); err != nil {','&j.ErrKind, &j.SHA256, &j.TargetPath, &j.TmpPath, &createdAt, &startedAt, &finishedAt,\n\t\t\t&nextRetryAt); err != nil {',1)
          s=s.replace('\t\tif err := rows.Scan(&j.ID, &j.EpisodeID, &j.MediaID, &j.Season, &j.Episode, &j.Provider, &src, &j.Quality,\n\t\t\t&j.Codec, &j.State, &j.Priority, &j.BytesTotal, &j.BytesDone, &j.PartsTotal, &j.PartsDone, &j.Attempts,\n\t\t\t&j.LastError, &j.ErrKind, &j.SHA256, &j.TargetPath, &j.TmpPath, &createdAt, &startedAt, &finishedAt,\n\t\t\t&nextRetryAt); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\t_ = json.Unmarshal([]byte(src), &j.Source)', '\t\tif err := rows.Scan(&j.ID, &j.EpisodeID, &j.MediaID, &j.Season, &j.Episode, &j.Provider, &src, &j.Quality,\n\t\t\t&j.Codec, &j.State, &j.Priority, &j.BytesTotal, &j.BytesDone, &j.PartsTotal, &j.PartsDone, &j.Attempts,\n\t\t\t&j.LastError, &j.ErrKind, &j.SHA256, &j.TargetPath, &j.TmpPath, &createdAt, &startedAt, &finishedAt,\n\t\t\t&nextRetryAt); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tj.CreatedAt = parseTime(createdAt)\n\t\tj.StartedAt = parseTime(startedAt)\n\t\tj.FinishedAt = parseTime(finishedAt)\n\t\tj.NextRetryAt = parseTime(nextRetryAt)\n\t\t_ = json.Unmarshal([]byte(src), &j.Source)', 1)
          s=s.replace('var p hermit.Playback\n\tvar completed int', 'var p hermit.Playback\n\tvar completed int\n\tvar updatedAt string', 1)
          s=s.replace('&p.EpisodeID, &p.PositionS, &p.DurationS, &completed, &p.UpdatedAt, &p.Source)', '&p.EpisodeID, &p.PositionS, &p.DurationS, &completed, &updatedAt, &p.Source)', 1)
          s=s.replace('\tp.Completed = completed != 0\n\treturn p, err', '\tp.UpdatedAt = parseTime(updatedAt)\n\tp.Completed = completed != 0\n\treturn p, err', 1)
          p.write_text(s)
          PY
          gofmt -w internal/provider/archiveorg.go internal/provider/debrid.go internal/srv/dlna.go internal/db/store.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/repair-once.yml
          git add .
          git commit -m 'fix: restore clean Go build and SQLite timestamp scans'
          git push
